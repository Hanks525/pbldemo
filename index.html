<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园活动平台</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --secondary: #22c55e;
      --secondary-light: #4ade80;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --radius: 10px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 25px rgba(99, 102, 241, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #f0f5ff 0%, #fef3c7 50%, #fce7f3 100%);
      min-height: 100vh;
      color: var(--text-primary);
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.5);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .navbar .inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h1 { 
      font-size: 22px; 
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .navbar-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 200ms ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { 
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }
    .btn-outline { 
      background: white; 
      color: var(--text-primary); 
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-outline:hover { 
      background: var(--bg-page); 
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .btn-sm { padding: 6px 12px; font-size: 13px; }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero-section {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: var(--radius-xl);
      padding: 32px;
      margin-bottom: 24px;
      color: white;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .hero-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .hero-desc {
      font-size: 15px;
      opacity: 0.9;
    }

    .search-area {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
      background: white;
      padding: 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    .search-box {
      flex: 1;
      min-width: 200px;
      max-width: 350px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      transition: all 200ms;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .filter-select {
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: white;
      cursor: pointer;
      transition: all 200ms;
    }
    .filter-select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-md);
      transition: all 200ms;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .stat-icon.blue { 
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%); 
      color: #3b82f6;
    }
    .stat-icon.green { 
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); 
      color: #22c55e;
    }
    .stat-icon.orange { 
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); 
      color: #f59e0b;
    }
    .stat-icon.purple { 
      background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%); 
      color: #8b5cf6;
    }
    .stat-value { 
      font-size: 24px; 
      font-weight: 700; 
      color: var(--text-primary);
    }
    .stat-label { 
      font-size: 12px; 
      color: var(--text-muted); 
      margin-top: 2px;
    }

    .content-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .content-layout { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-title { font-size: 22px; }
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .section-title { 
      font-size: 18px; 
      font-weight: 600; 
      color: var(--text-primary);
    }

    .activities-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .activity-card {
      background: white;
      border-radius: var(--radius-xl);
      overflow: hidden;
      cursor: pointer;
      transition: all 300ms ease;
      box-shadow: var(--shadow-md);
    }
    .activity-card:hover { 
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--shadow-lg);
    }
    .activity-cover {
      height: 160px;
      background: linear-gradient(135deg, var(--bg-page) 0%, #e2e8f0 100%);
      overflow: hidden;
      position: relative;
    }
    .activity-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 400ms ease;
    }
    .activity-card:hover .activity-cover img {
      transform: scale(1.08);
    }
    .activity-cover .placeholder {
      font-size: 40px;
      opacity: 0.6;
    }
    .activity-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
    .badge-upcoming { 
      background: rgba(245, 158, 11, 0.9); 
      color: white; 
    }
    .badge-active { 
      background: rgba(34, 197, 94, 0.9); 
      color: white; 
    }
    .badge-ended { 
      background: rgba(156, 163, 175, 0.9); 
      color: white; 
    }

    .activity-body { padding: 16px; }
    .activity-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text-primary);
    }
    .activity-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .activity-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
    }
    .activity-tag {
      padding: 3px 10px;
      background: var(--bg-page);
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-secondary);
      transition: all 200ms;
    }
    .activity-tag:hover {
      background: var(--primary);
      color: white;
    }
    .activity-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .activity-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-top: 10px;
    }
    .activity-cat {
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 500;
    }
    .cat-academic { 
      background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%); 
      color: var(--primary); 
    }
    .cat-cultural { 
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%); 
      color: #be185d; 
    }
    .cat-sports { 
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); 
      color: var(--secondary); 
    }
    .cat-social { 
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); 
      color: var(--warning); 
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .side-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-md);
    }
    .side-card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    .hot-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hot-item {
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 200ms;
    }
    .hot-item:hover { 
      background: var(--bg-page);
      transform: translateX(4px);
    }
    .hot-rank {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .hot-rank.top { 
      background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%); 
      color: white; 
    }
    .hot-info {
      flex: 1;
      min-width: 0;
    }
    .hot-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }
    .hot-meta { 
      font-size: 11px; 
      color: var(--text-muted); 
      margin-top: 2px;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-item {
      padding: 5px 14px;
      background: var(--bg-page);
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 200ms;
      color: var(--text-secondary);
    }
    .tag-item:hover { 
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      transform: translateY(-2px);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.show { 
      display: flex;
      animation: fadeIn 200ms ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .modal {
      background: white;
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 300ms ease;
    }
    @keyframes slideUp {
      from { 
        opacity: 0;
        transform: translateY(20px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: white;
    }
    .modal-title { 
      font-size: 16px; 
      font-weight: 600; 
      color: var(--text-primary);
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 50%;
      transition: all 200ms;
    }
    .modal-close:hover {
      background: var(--bg-page);
      color: var(--text-primary);
    }
    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-primary);
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      transition: all 200ms;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .form-textarea {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      min-height: 90px;
      resize: vertical;
      transition: all 200ms;
    }
    .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .auth-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .auth-tab {
      padding: 8px 20px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
      transition: all 200ms;
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 22px;
      border-radius: var(--radius);
      color: white;
      font-size: 14px;
      z-index: 2000;
      animation: slideInRight 300ms ease;
      box-shadow: var(--shadow-lg);
    }
    .notification.success { 
      background: linear-gradient(135deg, var(--secondary) 0%, #16a34a 100%); 
    }
    .notification.error { 
      background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%); 
    }
    @keyframes slideInRight {
      from { 
        transform: translateX(100%); 
        opacity: 0; 
      }
      to { 
        transform: translateX(0); 
        opacity: 1; 
      }
    }

    .profile-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .profile-tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
      transition: all 200ms;
    }
    .profile-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comment-item {
      padding: 14px;
      background: var(--bg-page);
      border-radius: var(--radius);
      transition: all 200ms;
    }
    .comment-item:hover {
      background: #f1f5f9;
    }
    .comment-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .comment-author { 
      font-size: 13px; 
      font-weight: 600; 
      color: var(--text-primary);
    }
    .comment-time { 
      font-size: 11px; 
      color: var(--text-muted); 
    }
    .comment-content { 
      font-size: 13px; 
      color: var(--text-secondary); 
      line-height: 1.5;
    }

    .participant-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .participant-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--bg-page);
      border-radius: var(--radius);
      transition: all 200ms;
    }
    .participant-item:hover {
      background: #f1f5f9;
    }
    .participant-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
    }
    .participant-name { 
      font-size: 13px; 
      color: var(--text-primary);
    }

    .share-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .share-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: white;
      cursor: pointer;
      transition: all 200ms;
    }
    .share-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: translateY(-2px);
    }
    .share-btn span { font-size: 24px; }
    .share-btn label { 
      font-size: 12px; 
      color: var(--text-secondary); 
      font-weight: 500;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="inner">
      <h1>🎓 校园活动平台</h1>
      <div class="navbar-actions">
        <span id="userGreeting" style="display: none; margin-right: 12px; font-size: 14px;">欢迎, <span id="currentUsername"></span></span>
        <button class="btn btn-outline" onclick="showModal('authModal')" id="authBtn">登录/注册</button>
        <button class="btn btn-primary" onclick="showModal('publishModal')">📝 发布活动</button>
        <button class="btn btn-outline" onclick="showUserProfile()" id="profileBtn" style="display: none;">👤 个人中心</button>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="hero-section">
      <h2 class="hero-title">发现精彩校园活动</h2>
      <p class="hero-desc">探索校园里的精彩活动，结识志同道合的伙伴</p>
    </div>

    <div class="search-area">
      <input type="text" id="searchInput" class="search-box" placeholder="搜索活动名称、地点、标签...">
      <select id="categoryFilter" class="filter-select">
        <option value="all">全部分类</option>
        <option value="academic">学术</option>
        <option value="cultural">文化</option>
        <option value="sports">体育</option>
        <option value="social">社交</option>
      </select>
      <select id="statusFilter" class="filter-select">
        <option value="all">全部状态</option>
        <option value="upcoming">即将开始</option>
        <option value="active">进行中</option>
        <option value="ended">已结束</option>
      </select>
      <select id="sortSelect" class="filter-select">
        <option value="newest">最新发布</option>
        <option value="soonest">即将开始</option>
      </select>
      <button class="btn btn-primary" onclick="searchActivities()">🔍 搜索</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue">📅</div>
        <div>
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">总活动数</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">✅</div>
        <div>
          <div class="stat-value" id="statActive">0</div>
          <div class="stat-label">进行中</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">👥</div>
        <div>
          <div class="stat-value" id="statParticipants">0</div>
          <div class="stat-label">报名人数</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">💬</div>
        <div>
          <div class="stat-value" id="statComments">0</div>
          <div class="stat-label">评论数</div>
        </div>
      </div>
    </div>

    <div class="content-layout">
      <div>
        <div class="section-header">
          <h2 class="section-title">✨ 最新活动</h2>
        </div>
        <div id="activitiesGrid" class="activities-list"></div>
      </div>

        <div class="side-card">
          <h3>📅 即将开始</h3>

  <div id="authModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">登录/注册</span>
        <button class="modal-close" onclick="hideModal('authModal')">×</button>

          <button class="auth-tab active" onclick="switchAuthTab('login')">登录</button>

        <div id="loginPanel">

            <label class="form-label">用户名</label>

            <label class="form-label">邮箱</label>
            <input type="email" id="registerEmail" class="form-input" placeholder="请输入邮箱">

          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" id="registerPassword" class="form-input" placeholder="请输入密码">
          </div>
          <button class="btn btn-primary" style="width: 100%;" onclick="handleRegister()">注册</button>
        </div>
      </div>

  </div>

  <div id="publishModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="publishTitle">发布活动</span>
        <button class="modal-close" onclick="hideModal('publishModal')">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editActivityId">
        <div class="form-group">
          <label class="form-label">活动标题</label>
          <input type="text" id="activityTitle" class="form-input" placeholder="请输入活动标题">

        <div class="form-group">

          <select id="activityCategory" class="form-input">
            <option value="academic">学术活动</option>

          <input type="datetime-local" id="activityTime" class="form-input">

        <div class="form-group">

          <input type="text" id="activityLocation" class="form-input" placeholder="请输入活动地点">

          <label class="form-label">活动图片（可选）</label>

  <div id="shareModal" class="modal-overlay">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <span class="modal-title">分享活动</span>
        <button class="modal-close" onclick="hideModal('shareModal')">×</button>

      <div class="modal-body">
        <div id="shareActivityTitle" style="font-weight: 600; margin-bottom: 16px; font-size: 15px;"></div>
        <div class="share-options">
          <button class="share-btn" onclick="shareTo('wechat')"><span>💬</span><label>微信</label></button>
          <button class="share-btn" onclick="shareTo('qq')"><span>🐧</span><label>QQ</label></button>
          <button class="share-btn" onclick="shareTo('weibo')"><span>📱</span><label>微博</label></button>

  <div id="participantsModal" class="modal-overlay">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <span class="modal-title">报名人员</span>
        <button class="modal-close" onclick="hideModal('participantsModal')">×</button>
      </div>
      <div class="modal-body">
        <div id="participantsList"></div>
      </div>
    </div>
  </div>

  <script>
    let isLoggedIn = false;
    let currentUser = null;
    let activities = [];
    let currentActivity = null;

    const mockActivities = [
      { id: 1, title: '人工智能学术讲座', category: 'academic', tags: ['AI', '讲座', '学术'], time: new Date(Date.now() + 86400000).toISOString(), location: '学术报告厅', description: '邀请知名AI专家分享最新研究成果，探讨人工智能未来发展趋势。', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=artificial%20intelligence%20technology%20abstract%20digital%20brain%20neural%20network%20blue%20purple%20gradient&image_size=landscape_4_3', participants: ['user1', 'user2'], comments: [{ author: 'user1', content: '期待！', time: new Date().toISOString() }], publisher: '学术部', createdAt: new Date(Date.now() - 86400000).toISOString() },
      { id: 2, title: '校园音乐节', category: 'cultural', tags: ['音乐', '演出', '校园'], time: new Date(Date.now() + 172800000).toISOString(), location: '体育馆', description: '年度校园音乐盛典，汇聚校园乐队和歌手，带来震撼的视听体验。', image: 'https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=600', participants: [], comments: [], publisher: '学生会', createdAt: new Date(Date.now() - 172800000).toISOString() },
      { id: 3, title: '篮球友谊赛', category: 'sports', tags: ['篮球', '比赛', '运动'], time: new Date(Date.now() + 259200000).toISOString(), location: '篮球场', description: '各学院篮球队之间的友谊赛，展现青春活力。', image: 'https://images.unsplash.com/photo-1546519638-68e109498ffc?w=600', participants: ['user3'], comments: [], publisher: '体育部', createdAt: new Date(Date.now() - 259200000).toISOString() },
      { id: 4, title: '读书会分享会', category: 'social', tags: ['阅读', '分享', '交流'], time: new Date(Date.now() + 43200000).toISOString(), location: '图书馆会议室', description: '每周读书会，分享阅读心得，结交志同道合的朋友。', image: 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=600', participants: ['user1', 'user4', 'user5'], comments: [{ author: 'user4', content: '好书推荐！', time: new Date().toISOString() }], publisher: '读书会', createdAt: new Date(Date.now() - 43200000).toISOString() },
      { id: 5, title: '创业分享沙龙', category: 'academic', tags: ['创业', '分享', '职场'], time: new Date(Date.now() + 345600000).toISOString(), location: '创业孵化中心', description: '邀请成功创业者分享创业经验，为在校学生提供创业指导。', image: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=600', participants: [], comments: [], publisher: '创业协会', createdAt: new Date(Date.now() - 345600000).toISOString() },
      { id: 6, title: '校园戏剧节', category: 'cultural', tags: ['戏剧', '表演', '艺术'], time: new Date(Date.now() + 518400000).toISOString(), location: '大学生活动中心', description: '精彩的校园戏剧演出，展现学生的艺术才华。', image: 'https://images.unsplash.com/photo-1507924538820-ede94a04019d?w=600', participants: ['user2', 'user6'], comments: [], publisher: '戏剧社', createdAt: new Date(Date.now() - 518400000).toISOString() },
    ];

    const categoryIcons = { academic: '📚', cultural: '🎭', sports: '⚽', social: '👫' };
    const favorites = [];
    const reminders = [];

    function init() {
      activities = [...mockActivities];
      renderActivities();
      updateStats();
      renderHotActivities();
      renderUpcomingActivities();
      renderHotTags();
    }

    function renderActivities(filteredActivities = activities) {
      const container = document.getElementById('activitiesGrid');
      if (filteredActivities.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无活动</div>';
        return;
      }
      container.innerHTML = filteredActivities.map(activity => `
        <div class="activity-card" onclick="showActivityDetail(${activity.id})">
          <div class="activity-cover">
            ${activity.image ? `<img src="${activity.image}" alt="${activity.title}">` : `<span class="placeholder">${categoryIcons[activity.category] || '📋'}</span>`}
            <span class="activity-badge badge-${getActivityStatus(activity)}">${getStatusText(activity)}</span>
          </div>
          <div class="activity-body">
            <div class="activity-title">${activity.title}</div>
            <div class="activity-desc">${activity.description}</div>
            <div class="activity-tags">
              ${activity.tags.map(tag => `<span class="activity-tag">${tag}</span>`).join('')}
            </div>
            <div class="activity-info"><span>📅</span>${formatDateTime(activity.time)}</div>
            <div class="activity-info"><span>📍</span>${activity.location}</div>
            <div class="activity-footer">
              <span class="activity-cat cat-${activity.category}">${getCategoryText(activity.category)}</span>
              <span style="font-size: 11px; color: var(--text-muted);">👤 ${activity.publisher}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function getActivityStatus(activity) {
      const now = new Date();
      const activityTime = new Date(activity.time);
      if (activityTime > now) return 'upcoming';
      const threeHoursLater = new Date(now.getTime() + 3 * 60 * 60 * 1000);
      return activityTime > threeHoursLater ? 'active' : 'ended';
    }

    function getStatusText(activity) {
      const status = getActivityStatus(activity);
      return status === 'upcoming' ? '即将开始' : status === 'active' ? '进行中' : '已结束';
    }

    function getCategoryText(category) {
      const map = { academic: '学术', cultural: '文化', sports: '体育', social: '社交' };
      return map[category] || category;
    }

    function formatDateTime(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function showActivityDetail(id) {
      currentActivity = activities.find(a => a.id === id);
      if (!currentActivity) return;

      const isRegistered = currentActivity.participants.includes(currentUser?.username);
      const isFavorite = favorites.includes(id);
      const hasReminder = reminders.includes(id);
      const isPublisher = currentUser?.username === currentActivity.publisher;

      document.getElementById('activityDetailContent').innerHTML = `
        <div style="margin-bottom: 16px;">
          <div class="activity-cover" style="border-radius: 12px; margin-bottom: 12px;">
            ${currentActivity.image ? `<img src="${currentActivity.image}" alt="${currentActivity.title}">` : `<span class="placeholder">${categoryIcons[currentActivity.category] || '📋'}</span>`}
          </div>
          <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">${currentActivity.title}</h2>
          <div class="activity-tags">
            ${currentActivity.tags.map(tag => `<span class="activity-tag">${tag}</span>`).join('')}
          </div>
        </div>
        <div style="margin-bottom: 16px; padding: 12px; background: var(--bg-page); border-radius: 10px;">
          <div class="activity-info"><span>📅</span><span>${formatDateTime(currentActivity.time)}</span></div>
          <div class="activity-info"><span>📍</span><span>${currentActivity.location}</span></div>
          <div class="activity-info"><span>👤</span><span>发布者：${currentActivity.publisher}</span></div>
          <div class="activity-info"><span>👥</span><span>报名人数：${currentActivity.participants.length}人</span></div>
        </div>
        <div style="margin-bottom: 16px;">
          <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.6;">${currentActivity.description}</p>
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
          ${isLoggedIn ? `
            <button class="btn ${isRegistered ? 'btn-outline' : 'btn-primary'}" onclick="handleRegisterActivity(${currentActivity.id})">
              ${isRegistered ? '取消报名' : '报名参加'}
            </button>
            <button class="btn btn-outline" onclick="${isFavorite ? 'removeFavorite' : 'addFavorite'}(${currentActivity.id})">
              ${isFavorite ? '❤️ 已收藏' : '🤍 收藏'}
            </button>
            <button class="btn btn-outline" onclick="${hasReminder ? 'removeReminder' : 'setReminder'}(${currentActivity.id})">
              ${hasReminder ? '🔔 已提醒' : '🔕 设置提醒'}
            </button>
          ` : ''}
          <button class="btn btn-outline" onclick="showShareModal(${currentActivity.id})">📤 分享</button>
          <button class="btn btn-outline" onclick="showParticipants(${currentActivity.id})">👥 查看报名</button>
          ${isPublisher ? `
            <button class="btn btn-outline" onclick="editActivity(${currentActivity.id})">✏️ 编辑</button>
            <button class="btn btn-danger btn-sm" onclick="handleDeleteActivity(${currentActivity.id})">🗑️ 删除</button>
          ` : ''}
        </div>
        <div>
          <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 12px;">💬 评论 (${currentActivity.comments.length})</h3>
          <div class="comment-list">
            ${currentActivity.comments.length === 0 ? '<div class="empty-state" style="padding: 15px;">暂无评论，快来发表第一条评论吧！</div>' : ''}
            ${currentActivity.comments.map(comment => `
              <div class="comment-item">
                <div class="comment-header">
                  <span class="comment-author">${comment.author}</span>
                  <span class="comment-time">${formatDateTime(comment.time)}</span>
                </div>
                <div class="comment-content">${comment.content}</div>
              </div>
            `).join('')}
          </div>
          ${isLoggedIn ? `
            <div style="margin-top: 16px;">
              <textarea id="commentInput" class="form-textarea" placeholder="发表评论..."></textarea>
              <button class="btn btn-primary" style="margin-top: 8px;" onclick="submitComment(${currentActivity.id})">发表评论</button>
            </div>
          ` : ''}
        </div>
      `;
      showModal('detailModal');
    }

    function searchActivities() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const status = document.getElementById('statusFilter').value;
      const sortBy = document.getElementById('sortSelect').value;

      let filtered = activities.filter(activity => {
        const matchKeyword = activity.title.toLowerCase().includes(keyword) || activity.description.toLowerCase().includes(keyword);
        const matchCategory = category === 'all' || activity.category === category;
        const matchStatus = status === 'all' || getActivityStatus(activity) === status;
        return matchKeyword && matchCategory && matchStatus;
      });

      filtered.sort((a, b) => {
        const timeA = new Date(a.time).getTime();
        const timeB = new Date(b.time).getTime();
        const createdA = new Date(a.createdAt).getTime();
        const createdB = new Date(b.createdAt).getTime();
        if (sortBy === 'newest') return (createdB || timeB) - (createdA || timeA);
        return timeA - timeB;
      });

      renderActivities(filtered);
    }

    document.getElementById('searchInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') searchActivities();
    });

    function showModal(id) {
      document.getElementById(id).classList.add('show');
    }

    function hideModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function switchAuthTab(tab) {
      document.getElementById('loginPanel').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerPanel').style.display = tab === 'register' ? 'block' : 'none';
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
    }

    function handleLogin() {
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      if (!username || !password) {
        showNotification('请输入用户名和密码', 'error');
        return;
      }
      isLoggedIn = true;
      currentUser = { username, email: username + '@example.com' };
      hideModal('authModal');
      updateUIAfterLogin();
      showNotification('登录成功！');
    }

    function handleRegister() {
      const username = document.getElementById('registerUsername').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      if (!username || !email || !password) {
        showNotification('请填写完整信息', 'error');
        return;
      }
      isLoggedIn = true;
      currentUser = { username, email };
      hideModal('authModal');
      updateUIAfterLogin();
      showNotification('注册成功！');
    }

    function updateUIAfterLogin() {
      document.getElementById('userGreeting').style.display = 'inline';
      document.getElementById('currentUsername').textContent = currentUser.username;
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('profileBtn').style.display = 'inline-flex';
    }

    function showNotification(message, type = 'success') {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
    }

    function handlePublish() {
      const id = document.getElementById('editActivityId').value;
      const title = document.getElementById('activityTitle').value;
      const category = document.getElementById('activityCategory').value;
      const tags = document.getElementById('activityTags').value.split(',').map(t => t.trim()).filter(Boolean);
      const time = document.getElementById('activityTime').value;
      const location = document.getElementById('activityLocation').value;
      const description = document.getElementById('activityDescription').value;
      const image = document.getElementById('activityImage').value;

      if (!title || !time || !location || !description) {
        showNotification('请填写必填项', 'error');
        return;
      }

      if (id) {
        const index = activities.findIndex(a => a.id === parseInt(id));
        if (index !== -1) {
          activities[index] = { ...activities[index], title, category, tags, time, location, description, image };
          showNotification('活动更新成功！');
        }
      } else {
        const newActivity = {
          id: Date.now(),
          title,
          category,
          tags,
          time: new Date(time).toISOString(),
          location,
          description,
          image: image || '',
          participants: [],
          comments: [],
          publisher: currentUser?.username || '匿名',
          createdAt: new Date().toISOString()
        };
        activities.unshift(newActivity);
        showNotification('活动发布成功！');
      }

      hideModal('publishModal');
      document.getElementById('editActivityId').value = '';
      document.getElementById('activityTitle').value = '';
      document.getElementById('activityCategory').value = 'academic';
      document.getElementById('activityTags').value = '';
      document.getElementById('activityTime').value = '';
      document.getElementById('activityLocation').value = '';
      document.getElementById('activityDescription').value = '';
      document.getElementById('activityImage').value = '';
      document.getElementById('publishTitle').textContent = '发布活动';

      renderActivities();
      updateStats();
      renderHotActivities();
      renderUpcomingActivities();
      renderHotTags();
    }

    function editActivity(id) {
      const activity = activities.find(a => a.id === id);
      if (!activity) return;

      document.getElementById('editActivityId').value = id;
      document.getElementById('activityTitle').value = activity.title;
      document.getElementById('activityCategory').value = activity.category;
      document.getElementById('activityTags').value = activity.tags.join(', ');
      document.getElementById('activityTime').value = activity.time.slice(0, 16);
      document.getElementById('activityLocation').value = activity.location;
      document.getElementById('activityDescription').value = activity.description;
      document.getElementById('activityImage').value = activity.image;
      document.getElementById('publishTitle').textContent = '编辑活动';

      hideModal('detailModal');
      showModal('publishModal');
    }

    function handleDeleteActivity(id) {
      if (confirm('确定要删除这个活动吗？')) {
        activities = activities.filter(a => a.id !== id);
        hideModal('detailModal');
        showNotification('活动已删除');
        renderActivities();
        updateStats();
        renderHotActivities();
        renderUpcomingActivities();
      }
    }

    function handleRegisterActivity(id) {
      if (!isLoggedIn) {
        showNotification('请先登录', 'error');
        showModal('authModal');
        return;
      }

      const activity = activities.find(a => a.id === id);
      if (!activity) return;

      const index = activity.participants.indexOf(currentUser.username);
      if (index === -1) {
        activity.participants.push(currentUser.username);
        showNotification('报名成功！');
      } else {
        activity.participants.splice(index, 1);
        showNotification('已取消报名');
      }

      updateStats();
      if (currentActivity?.id === id) showActivityDetail(id);
    }

    function addFavorite(id) {
      if (!favorites.includes(id)) {
        favorites.push(id);
        showNotification('已添加收藏');
      }
      if (currentActivity?.id === id) showActivityDetail(id);
    }

    function removeFavorite(id) {
      const index = favorites.indexOf(id);
      if (index !== -1) {
        favorites.splice(index, 1);
        showNotification('已取消收藏');
      }
      if (currentActivity?.id === id) showActivityDetail(id);
    }

    function setReminder(id) {
      if (!reminders.includes(id)) {
        reminders.push(id);
        showNotification('已设置提醒，活动开始前将通知您');
      }
      if (currentActivity?.id === id) showActivityDetail(id);
    }

    function removeReminder(id) {
      const index = reminders.indexOf(id);
      if (index !== -1) {
        reminders.splice(index, 1);
        showNotification('已取消提醒');
      }
      if (currentActivity?.id === id) showActivityDetail(id);
    }

    function showShareModal(id) {
      const activity = activities.find(a => a.id === id);
      if (activity) {
        document.getElementById('shareActivityTitle').textContent = activity.title;
        showModal('shareModal');
      }
    }

    function shareTo(platform) {
      const texts = { wechat: '微信分享', qq: 'QQ分享', weibo: '微博分享' };
      showNotification(`${texts[platform]}已触发`);
      hideModal('shareModal');
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      showNotification('链接已复制到剪贴板');
      hideModal('shareModal');
    }

    function showParticipants(id) {
      const activity = activities.find(a => a.id === id);
      if (!activity) return;

      if (activity.participants.length === 0) {
        document.getElementById('participantsList').innerHTML = '<div class="empty-state" style="padding: 15px;">暂无报名人员</div>';
      } else {
        document.getElementById('participantsList').innerHTML = `
          <div class="participant-list">
            ${activity.participants.map(user => `
              <div class="participant-item">
                <div class="participant-avatar">${user.charAt(0).toUpperCase()}</div>
                <span class="participant-name">${user}</span>
              </div>
            `).join('')}
          </div>
        `;
      }
      showModal('participantsModal');
    }

    function submitComment(id) {
      const content = document.getElementById('commentInput').value.trim();
      if (!content) {
        showNotification('请输入评论内容', 'error');
        return;
      }

      const activity = activities.find(a => a.id === id);
      if (activity) {
        activity.comments.push({ author: currentUser.username, content, time: new Date().toISOString() });
        document.getElementById('commentInput').value = '';
        showNotification('评论发布成功！');
        showActivityDetail(id);
        updateStats();
      }
    }

    function showUserProfile() {
      showProfileTab('registered');
      showModal('profileModal');
    }

    function showProfileTab(tab) {
      const content = document.getElementById('profileContent');
      
      const renderActivityCard = (a) => `
        <div class="activity-card" style="cursor: pointer;" onclick="showActivityDetail(${a.id}); hideModal('profileModal')">
          <div class="activity-cover">
            ${a.image ? `<img src="${a.image}" alt="${a.title}">` : `<span class="placeholder">${categoryIcons[a.category] || '📋'}</span>`}
            <span class="activity-badge badge-${getActivityStatus(a)}">${getStatusText(a)}</span>
          </div>
          <div class="activity-body">
            <div class="activity-title">${a.title}</div>
            <div class="activity-info"><span>📅</span>${formatDateTime(a.time)}</div>
            <div class="activity-info"><span>📍</span>${a.location}</div>
          </div>
        </div>
      `;

      if (tab === 'registered') {
        const registeredActivities = activities.filter(a => a.participants.includes(currentUser.username));
        content.innerHTML = registeredActivities.length === 0 
          ? '<div class="empty-state">暂无报名活动</div>'
          : registeredActivities.map(renderActivityCard).join('');
      } else if (tab === 'favorites') {
        const favoriteActivities = activities.filter(a => favorites.includes(a.id));
        content.innerHTML = favoriteActivities.length === 0 
          ? '<div class="empty-state">暂无收藏活动</div>'
          : favoriteActivities.map(renderActivityCard).join('');
      } else if (tab === 'reminders') {
        const reminderActivities = activities.filter(a => reminders.includes(a.id));
        content.innerHTML = reminderActivities.length === 0 
          ? '<div class="empty-state">暂无提醒活动</div>'
          : reminderActivities.map(renderActivityCard).join('');
      } else if (tab === 'myActivities') {
        const myActivities = activities.filter(a => a.publisher === currentUser.username);
        content.innerHTML = myActivities.length === 0 
          ? '<div class="empty-state">暂无发布活动</div>'
          : myActivities.map(renderActivityCard).join('');
      }

      document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = activities.length;
      document.getElementById('statActive').textContent = activities.filter(a => getActivityStatus(a) === 'active').length;
      document.getElementById('statParticipants').textContent = activities.reduce((sum, a) => sum + a.participants.length, 0);
      document.getElementById('statComments').textContent = activities.reduce((sum, a) => sum + a.comments.length, 0);
    }

    function renderHotActivities() {
      const sorted = [...activities].sort((a, b) => {
        const scoreA = a.participants.length * 2 + a.comments.length;
        const scoreB = b.participants.length * 2 + b.comments.length;
        return scoreB - scoreA;
      }).slice(0, 5);

      document.getElementById('hotActivities').innerHTML = sorted.map((activity, index) => `
        <div class="hot-item" onclick="showActivityDetail(${activity.id})">
          <div class="hot-rank ${index < 3 ? 'top' : ''}">${index + 1}</div>
          <div class="hot-info">
            <div class="hot-title">${activity.title}</div>
            <div class="hot-meta">${activity.participants.length}人报名</div>
          </div>
        </div>
      `).join('');
    }

    function renderUpcomingActivities() {
      const sorted = [...activities]
        .filter(a => getActivityStatus(a) === 'upcoming')
        .sort((a, b) => new Date(a.time) - new Date(b.time))
        .slice(0, 5);

      document.getElementById('upcomingActivities').innerHTML = sorted.map(activity => `
        <div class="hot-item" onclick="showActivityDetail(${activity.id})">
          <div class="hot-rank">📅</div>
          <div class="hot-info">
            <div class="hot-title">${activity.title}</div>
            <div class="hot-meta">${formatDateTime(activity.time)}</div>
          </div>
        </div>
      `).join('');
    }

    function renderHotTags() {
      const tagCount = {};
      activities.forEach(activity => {
        activity.tags.forEach(tag => {
          tagCount[tag] = (tagCount[tag] || 0) + 1;
        });
      });

      const sortedTags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 8);

      document.getElementById('hotTags').innerHTML = sortedTags.map(([tag, count]) => `
        <span class="tag-item" onclick="filterByTag('${tag}')">${tag} (${count})</span>
      `).join('');
    }

    function filterByTag(tag) {
      document.getElementById('searchInput').value = tag;
      searchActivities();
    }

    document.addEventListener('click', e => {
      if (e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('show');
      }
    });

    init();
  </script>
</body>
</html>
